<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cinder Run: Sky Relay</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="game-wrap" aria-label="Cinder Run: Sky Relay game">
        <div class="hud" aria-live="polite">
          <div>
            <span class="hud-label">Stage</span>
            <strong id="levelName">1-1 Ember Gate</strong>
          </div>
          <div>
            <span class="hud-label">Prisms</span>
            <strong id="score">0</strong>
          </div>
          <div>
            <span class="hud-label">Spark</span>
            <strong id="hearts">3</strong>
          </div>
          <div id="bossHud" class="boss-hud" hidden>
            <span class="hud-label">Warden</span>
            <strong id="bossHearts">---</strong>
          </div>
          <div class="audio-hud">
            <span class="hud-label">Tune</span>
            <button id="musicButton" class="hud-button" type="button" aria-pressed="false">Silence</button>
          </div>
        </div>

        <canvas id="game" width="384" height="216" aria-label="Cinder Run: Sky Relay"></canvas>

        <div id="message" class="message">
          <h1>Cinder Run: Sky Relay</h1>
          <p>Dash the ember road, gather prism sparks, and relight three towers before the sky grid fades.</p>
          <button id="startButton" type="button">Begin Relay</button>
        </div>

        <div class="controls" aria-label="Keyboard controls">
          <span>Run: A/D or Arrows</span>
          <span>Leap: W, Up, or Space</span>
          <span>Speed boosts leaps</span>
          <span>Tune: M</span>
          <span>Retry: R</span>
          <span>Title: Esc</span>
        </div>
      </section>
    </main>

    <script src="src/game.js"></script>
  </body>
</html>
