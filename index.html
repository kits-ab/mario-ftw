<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cinder Run: Sky Relay</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="game-wrap" aria-label="Cinder Run game">
        <div class="hud" aria-live="polite">
          <div>
            <span class="hud-label">Level</span>
            <strong id="levelName">1-1 Ember Fields</strong>
          </div>
          <div>
            <span class="hud-label">Crystals</span>
            <strong id="score">0</strong>
          </div>
          <div>
            <span class="hud-label">Hearts</span>
            <strong id="hearts">3</strong>
          </div>
          <div id="bossHud" class="boss-hud" hidden>
            <span class="hud-label">Boss</span>
            <strong id="bossHearts">---</strong>
          </div>
          <div class="audio-hud">
            <span class="hud-label">Audio</span>
            <button id="musicButton" class="hud-button" type="button" aria-pressed="false">Mute</button>
          </div>
        </div>

        <canvas id="game" width="384" height="216" aria-label="Cinder Run: Sky Relay"></canvas>

        <div id="message" class="message">
          <h1>Cinder Run: Sky Relay</h1>
          <p>An original pocket-sized platformer. Run, jump, collect prism crystals, and clear three stages.</p>
          <button id="startButton" type="button">Start Run</button>
        </div>

        <div class="controls" aria-label="Keyboard controls">
          <span>Move: A/D or Arrows</span>
          <span>Jump: W, Up, or Space</span>
          <span>Music: M</span>
          <span>Restart: R</span>
          <span>Menu: Esc</span>
        </div>
      </section>
    </main>

    <script src="src/game.js"></script>
  </body>
</html>
