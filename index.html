<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Glödloppet: Himmelreläet</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="game-wrap" aria-label="Glödloppet: Himmelreläet">
        <div class="hud" aria-live="polite">
          <div>
            <span class="hud-label">Bana</span>
            <strong id="levelName">1-1 Glödporten</strong>
          </div>
          <div>
            <span class="hud-label">Prismor</span>
            <strong id="score">0</strong>
          </div>
          <div>
            <span class="hud-label">Gnista</span>
            <strong id="hearts">3</strong>
          </div>
          <div id="bossHud" class="boss-hud" hidden>
            <span class="hud-label">Väktare</span>
            <strong id="bossHearts">---</strong>
          </div>
          <div class="audio-hud">
            <span class="hud-label">Melodi</span>
            <button id="musicButton" class="hud-button" type="button" aria-pressed="false">Tysta</button>
          </div>
        </div>

        <canvas id="game" width="384" height="216" aria-label="Glödloppet: Himmelreläet"></canvas>

        <div id="message" class="message">
          <h1>Glödloppet: Himmelreläet</h1>
          <p>Rusa längs glödvägen, samla prismagnistor och tänd tre torn innan himmelnätet bleknar.</p>
          <button id="startButton" type="button">Starta reläet</button>
        </div>

        <div class="controls" aria-label="Tangentbordskontroller">
          <span>Spring: A/D eller pilar</span>
          <span>Hoppa: W, upp eller mellanslag</span>
          <span>Fart ger högre hopp</span>
          <span>Melodi: M</span>
          <span>Försök igen: R</span>
          <span>Titel: Esc</span>
        </div>
      </section>
    </main>

    <script src="src/game.js"></script>
  </body>
</html>
